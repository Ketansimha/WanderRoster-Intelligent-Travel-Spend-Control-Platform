<template>
    <lightning-card title="AI Travel Spend Optimizer" icon-name="utility:magicwand">
        <div class="slds-p-around_medium">
            <template if:true={hasData}>
                <!-- Spend Comparison Header -->
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                        <div class="slds-box slds-box_small slds-theme_shade slds-text-align_center">
                            <div class="slds-text-title_caps slds-text-color_weak">Original Estimate</div>
                            <div class="slds-text-heading_medium font-bold">₹{recommendations.originalTotal}</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                        <div class="slds-box slds-box_small slds-theme_success slds-text-align_center" style="background-color: #eefbee; border-color: #4bca81;">
                            <div class="slds-text-title_caps slds-text-color_success font-bold">Potential Savings</div>
                            <div class="slds-text-heading_medium font-bold slds-text-color_success">₹{recommendations.totalPotentialSavings}</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                        <div class="slds-box slds-box_small slds-theme_shade slds-text-align_center">
                            <div class="slds-text-title_caps slds-text-color_weak">Optimized Total</div>
                            <div class="slds-text-heading_medium font-bold slds-text-color_brand">₹{recommendations.recommendedTotal}</div>
                        </div>
                    </div>
                </div>

                <!-- Executive AI Summary -->
                <div class="slds-box slds-theme_info slds-m-bottom_medium" style="background-color: #f3f8fd; border-left: 4px solid #0176d3;">
                    <p class="slds-text-body_regular">{recommendations.executiveSummary}</p>
                </div>

                <!-- Recommendation Items List -->
                <div class="slds-m-top_small">
                    <h3 class="slds-text-title_bold slds-m-bottom_x-small">Actionable Spend Recommendations</h3>
                    <template for:each={recommendations.items} for:item="item">
                        <div key={item.title} class="slds-box slds-box_small slds-m-bottom_x-small slds-theme_default">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                <div>
                                    <span class="slds-badge slds-theme_shade">{item.category}</span>
                                    <span class="font-bold slds-m-left_x-small">{item.title}</span>
                                </div>
                                <div class="slds-text-align_right">
                                    <span class="slds-text-color_success font-bold">+₹{item.potentialSavings} Savings</span>
                                    <span class="slds-badge slds-badge_lightest slds-m-left_x-small">Confidence: {item.confidenceLevel}</span>
                                </div>
                            </div>
                            <p class="slds-text-body_small slds-m-top_x-small slds-text-color_weak">{item.suggestion}</p>
                            <div class="slds-grid slds-grid_align-spread slds-m-top_xx-small slds-text-body_small">
                                <span>Requested: ₹{item.currentEstimate}</span>
                                <span class="font-bold slds-text-color_brand">Optimized: ₹{item.optimizedEstimate}</span>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template if:false={hasData}>
                <div class="slds-illustration slds-illustration_small slds-text-align_center slds-p-around_medium">
                    <p class="slds-text-color_weak">Enter travel details to generate intelligent cost-saving recommendations.</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
